{% extends "base.html" %}
{% block title %}Join Room — PenFight Arena{% endblock %}
{% block content %}
<div style="max-width:440px; margin:40px auto;">
  <div class="pf-glass" style="padding:36px;">
    <div class="pf-center pf-mb-24">
      <div class="pf-icon-lg" style="color:var(--gold); width:48px; height:48px; margin:0 auto;"><svg><use href="#icon-key"></use></svg></div>
      <h2 class="pf-mt-8" style="font-family:var(--font-display); font-size:26px; font-weight:800;">JOIN A PRIVATE ROOM</h2>
      <p class="pf-muted pf-mt-8">Enter the room code your friend shared with you.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="pf-field">
        <label class="pf-label">Room Code</label>
        <input class="pf-input" type="text" name="code" placeholder="PF-XXXX" style="text-align:center; font-size:22px; letter-spacing:0.12em; text-transform:uppercase; font-family:var(--font-display); font-weight:800;" maxlength="10" required>
      </div>
      <button type="submit" class="pf-btn pf-btn-primary pf-btn-block pf-btn-lg">
        <span class="pf-icon"><svg><use href="#icon-swords"></use></svg></span>
        <span>JOIN ROOM</span>
      </button>
    </form>
    <p class="pf-center pf-muted pf-mt-24" style="font-size:13px;">
      Don't have a code? <a href="{% url 'multiplayer:room_create' %}" style="color:var(--violet-bright); font-weight:700;">Create your own room</a>
    </p>
  </div>
</div>
{% endblock %}
