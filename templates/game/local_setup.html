{% extends "base.html" %}
{% block title %}Local Battle Setup — PenFight Arena{% endblock %}

{% block content %}
<div class="pf-page-head">
  <div class="pf-page-title" style="display:flex; align-items:center; gap:10px;">
    <span class="pf-icon-lg" style="color:var(--violet-bright);"><svg><use href="#icon-monitor"></use></svg></span>
    <span>LOCAL DUEL SETUP</span>
  </div>
  <div class="pf-page-sub">Two players, one device. Pass the desk and fight it out on the same bench.</div>
</div>

<div class="pf-grid pf-grid-2">
  <div class="pf-card" style="border-color: rgba(59,130,246,0.4);">
    <div class="pf-section-title" style="color:#60a5fa; display:flex; align-items:center; gap:8px;">
      <span class="pf-avatar-circle" style="width:20px; height:20px; font-size:10px; background:var(--p1-blue);">1</span>
      <span>PLAYER 1 (YOU)</span>
    </div>
    <div class="pf-field">
      <label class="pf-label">Name</label>
      <input class="pf-input" id="p1-name" value="{{ request.user.username }}" maxlength="16">
    </div>
    <div class="pf-field">
      <label class="pf-label">Pen</label>
      <select class="pf-select" id="p1-pen">
        {% for pen in pens %}<option value="{{ pen.id }}" data-mass="{{ pen.mass }}" data-friction="{{ pen.friction }}" data-power="{{ pen.max_power }}">{{ pen.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="pf-field">
      <label class="pf-label">Skin</label>
      <select class="pf-select" id="p1-skin">
        {% for skin in skins %}<option value="{{ skin.id }}" data-asset="{{ skin.asset_key }}" data-color="{{ skin.body_color }}" data-accent="{{ skin.accent_color }}" data-trail="{{ skin.trail_color }}" data-glow="{{ skin.glow|yesno:'1,0' }}">{{ skin.name }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="pf-card" style="border-color: rgba(248,113,113,0.4);">
    <div class="pf-section-title" style="color:#f87171; display:flex; align-items:center; gap:8px;">
      <span class="pf-avatar-circle" style="width:20px; height:20px; font-size:10px; background:var(--p2-red);">2</span>
      <span>PLAYER 2</span>
    </div>
    <div class="pf-field">
      <label class="pf-label">Name</label>
      <input class="pf-input" id="p2-name" value="Player 2" maxlength="16">
    </div>
    <div class="pf-field">
      <label class="pf-label">Pen</label>
      <select class="pf-select" id="p2-pen">
        {% for pen in pens %}<option value="{{ pen.id }}" data-mass="{{ pen.mass }}" data-friction="{{ pen.friction }}" data-power="{{ pen.max_power }}">{{ pen.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="pf-field">
      <label class="pf-label">Skin</label>
      <select class="pf-select" id="p2-skin">
        {% for skin in skins %}<option value="{{ skin.id }}" data-asset="{{ skin.asset_key }}" data-color="{{ skin.body_color }}" data-accent="{{ skin.accent_color }}" data-trail="{{ skin.trail_color }}" data-glow="{{ skin.glow|yesno:'1,0' }}" {% if forloop.counter == 5 %}selected{% endif %}>{{ skin.name }}</option>{% endfor %}
      </select>
    </div>
  </div>
</div>

<div class="pf-card pf-mt-24" style="border-color: rgba(139,92,246,0.4);">
  <div class="pf-section-title" style="color:#a78bfa; display:flex; align-items:center; gap:8px;">
    <span class="pf-icon" style="color:var(--violet-bright);"><svg><use href="#icon-monitor"></use></svg></span>
    <span>ARENA</span>
  </div>
  <div class="pf-field">
    <label class="pf-label">Select Arena</label>
    <select class="pf-select" id="arena-select">
      {% for arena in arenas %}<option value="{{ arena.slug }}">{{ arena.name }}</option>{% endfor %}
    </select>
  </div>
</div>

<div class="pf-center pf-mt-32">
  <button class="pf-btn pf-btn-primary pf-btn-lg" id="start-btn">
    <span class="pf-icon"><svg><use href="#icon-swords"></use></svg></span>
    <span>START PENFIGHT</span>
  </button>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function readSkin(id) {
    const opt = document.getElementById(id).selectedOptions[0];
    return { id: opt.value, assetKey: opt.dataset.asset || 'classic-blue', color: opt.dataset.color, accent: opt.dataset.accent, trail: opt.dataset.trail, glow: opt.dataset.glow === '1' };
  }
  function readPen(id) {
    const opt = document.getElementById(id).selectedOptions[0];
    return { id: opt.value, mass: parseFloat(opt.dataset.mass), friction: parseFloat(opt.dataset.friction), power: parseFloat(opt.dataset.power) };
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    const arenaSlug = document.getElementById('arena-select').value;
    const config = {
      player1: { name: document.getElementById('p1-name').value || 'Player 1', pen: readPen('p1-pen'), skin: readSkin('p1-skin') },
      player2: { name: document.getElementById('p2-name').value || 'Player 2', pen: readPen('p2-pen'), skin: readSkin('p2-skin') },
      arena: arenaSlug,
    };
    sessionStorage.setItem('pf_local_config', JSON.stringify(config));
    window.location.href = "{% url 'game:local_play' %}?arena=" + arenaSlug;
  });
</script>
{% endblock %}
